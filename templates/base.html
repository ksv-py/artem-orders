<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Artem Orders{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">Artem Orders</a>
  <nav>
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('order_list') }}">Orders</a>
    <a href="{{ url_for('karigar_list') }}">Karigars</a>
    <a class="btn small" href="{{ url_for('order_new') }}">+ New Order</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash">{% for m in messages %}<p>{{ m }}</p>{% endfor %}</div>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer><p>Artem Interiors &amp; Constructions &mdash; workshop order tracking</p></footer>
</body>
</html>
